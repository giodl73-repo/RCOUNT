[package]
name = "rcount-package-workbench"
version = "0.1.0"
edition = "2021"
license = "MIT"
publish = false

[workspace]

[lib]
crate-type = ["cdylib", "rlib"]

[[bin]]
name = "rcount-workbench-control"
path = "src/main.rs"

[[bin]]
name = "rcount-workbench-examples"
path = "src/examples.rs"

[dependencies]
rcount-core = { path = "../../crates/rcount-core" }
rcount-io = { path = "../../crates/rcount-io" }
rcount-audit = { path = "../../crates/rcount-audit" }
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"
wasm-bindgen = "=0.2.127"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
